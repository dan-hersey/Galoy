<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="400" rx="16" fill="url(#bgG)"/>

  <!-- Title -->
  <text x="240" y="36" text-anchor="middle" fill="#92400e" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">SETTLEMENT COMPARISON</text>

  <!-- Left column: Traditional -->
  <rect x="24" y="54" width="208" height="320" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="24" y="54" width="208" height="38" rx="12" fill="#f3f4f6"/>
  <rect x="24" y="78" width="208" height="14" fill="#f3f4f6"/>
  <text x="128" y="79" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Traditional Rails</text>

  <!-- Traditional: Settlement -->
  <rect x="40" y="104" width="176" height="48" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="124" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Settlement</text>
  <text x="52" y="142" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">2–5 days</text>

  <!-- Traditional: Availability -->
  <rect x="40" y="162" width="176" height="48" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="182" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Availability</text>
  <text x="52" y="200" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Business hours</text>

  <!-- Traditional: Cross-border -->
  <rect x="40" y="220" width="176" height="48" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="240" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Cross-Border</text>
  <text x="52" y="258" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">3–6 intermediaries</text>

  <!-- Traditional: Fees -->
  <rect x="40" y="278" width="176" height="48" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="298" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Fees</text>
  <text x="52" y="316" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">$25–$50+</text>

  <!-- Divider arrow -->
  <text x="240" y="208" text-anchor="middle" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="20">→</text>

  <!-- Right column: Bitcoin -->
  <rect x="248" y="54" width="208" height="320" rx="12" fill="white" stroke="#f59e0b" stroke-width="2"/>
  <rect x="248" y="54" width="208" height="38" rx="12" fill="#f59e0b"/>
  <rect x="248" y="78" width="208" height="14" fill="#f59e0b"/>
  <text x="352" y="79" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Bitcoin + Lightning</text>

  <!-- Bitcoin: Settlement -->
  <rect x="264" y="104" width="176" height="48" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="276" y="124" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Settlement</text>
  <text x="276" y="142" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">Seconds</text>

  <!-- Bitcoin: Availability -->
  <rect x="264" y="162" width="176" height="48" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="276" y="182" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Availability</text>
  <text x="276" y="200" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">24/7/365</text>

  <!-- Bitcoin: Cross-border -->
  <rect x="264" y="220" width="176" height="48" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="276" y="240" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Cross-Border</text>
  <text x="276" y="258" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Peer-to-peer, direct</text>

  <!-- Bitcoin: Fees -->
  <rect x="264" y="278" width="176" height="48" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="276" y="298" fill="#065f46" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Fees</text>
  <text x="276" y="316" fill="#047857" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Near zero</text>

  <!-- Bottom tagline -->
  <text x="240" y="392" text-anchor="middle" fill="#92400e" font-family="Inter, system-ui, sans-serif" font-size="10">Powered by Galoy Bitcoin Stack</text>
</svg>