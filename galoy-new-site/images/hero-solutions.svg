<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" fill="none">
  <!-- Background -->
  <rect width="600" height="520" rx="16" fill="#0f172a"/>
  <rect x="1" y="1" width="598" height="518" rx="15" stroke="rgba(54,84,255,0.3)" stroke-width="1"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(54,84,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="520" fill="url(#grid)"/>

  <!-- Title -->
  <text x="300" y="40" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="rgba(54,84,255,0.8)" letter-spacing="2">GALOY PLATFORM</text>

  <!-- Grouped container: Core + Use Cases (dotted border) -->
  <rect x="24" y="56" width="552" height="310" rx="12" fill="rgba(54,84,255,0.03)" stroke="rgba(54,84,255,0.2)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Central Hub: Banking Core -->
  <rect x="180" y="74" width="240" height="52" rx="10" fill="rgba(54,84,255,0.15)" stroke="#3654FF" stroke-width="1.5"/>
  <text x="300" y="96" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3ff">Bitcoin-Native</text>
  <text x="300" y="114" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="white">Banking Core</text>

  <!-- Connector lines from core directly to solutions -->
  <line x1="205" y1="100" x2="110" y2="100" stroke="rgba(54,84,255,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="110" y1="100" x2="110" y2="148" stroke="rgba(54,84,255,0.3)" stroke-width="1" stroke-dasharray="4,3"/>

  <line x1="250" y1="126" x2="250" y2="148" stroke="rgba(54,84,255,0.3)" stroke-width="1" stroke-dasharray="4,3"/>

  <line x1="350" y1="126" x2="350" y2="148" stroke="rgba(54,84,255,0.3)" stroke-width="1" stroke-dasharray="4,3"/>

  <line x1="395" y1="100" x2="490" y2="100" stroke="rgba(54,84,255,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="490" y1="100" x2="490" y2="148" stroke="rgba(54,84,255,0.3)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Solution 1: Bitcoin-Backed Lending -->
  <rect x="40" y="148" width="140" height="206" rx="10" fill="rgba(54,84,255,0.08)" stroke="rgba(54,84,255,0.25)" stroke-width="1"/>
  <!-- Icon centered -->
  <rect x="94" y="164" width="32" height="32" rx="7" fill="rgba(54,84,255,0.2)"/>
  <g transform="translate(101, 170)" fill="none" stroke="#6b82ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="9" y1="2" x2="9" y2="14"/>
    <line x1="3" y1="14" x2="15" y2="14"/>
    <line x1="3" y1="2" x2="15" y2="2"/>
    <line x1="5" y1="2" x2="5" y2="14"/>
    <line x1="13" y1="2" x2="13" y2="14"/>
    <line x1="1" y1="16" x2="17" y2="16"/>
    <line x1="9" y1="0" x2="3" y2="2"/>
    <line x1="9" y1="0" x2="15" y2="2"/>
  </g>
  <!-- Title centered below icon -->
  <text x="110" y="216" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Bitcoin-Backed</text>
  <text x="110" y="232" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Lending</text>
  <!-- Features -->
  <text x="110" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Powered by Lana</text>
  <text x="110" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">LTV Monitoring</text>
  <text x="110" y="296" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Margin Calls</text>
  <text x="110" y="314" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Custody-Independent</text>

  <!-- Solution 2: Bitcoin Payments -->
  <rect x="196" y="148" width="120" height="206" rx="10" fill="rgba(54,84,255,0.08)" stroke="rgba(54,84,255,0.25)" stroke-width="1"/>
  <!-- Icon centered -->
  <rect x="240" y="164" width="32" height="32" rx="7" fill="rgba(54,84,255,0.2)"/>
  <g transform="translate(248, 170)" fill="none" stroke="#6b82ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="8,0 3,10 7,10 5,18 13,7 9,7"/>
  </g>
  <!-- Title centered below icon -->
  <text x="256" y="216" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Bitcoin</text>
  <text x="256" y="232" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Payments</text>
  <!-- Features -->
  <text x="256" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Lightning Network</text>
  <text x="256" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Instant Settlement</text>
  <text x="256" y="296" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Cross-Border</text>

  <!-- Solution 3: Stablecoin Payments -->
  <rect x="332" y="148" width="120" height="206" rx="10" fill="rgba(54,84,255,0.08)" stroke="rgba(54,84,255,0.25)" stroke-width="1"/>
  <!-- Icon centered -->
  <rect x="376" y="164" width="32" height="32" rx="7" fill="rgba(54,84,255,0.2)"/>
  <g transform="translate(384, 170)" fill="none" stroke="#6b82ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="0" x2="8" y2="18"/>
    <path d="M12,3 C12,3 10,2 8,2 C5,2 3,4 3,6 C3,8.5 5,10 8,10 C11,10 13,11.5 13,14 C13,16 11,18 8,18 C5,18 3,16 3,16"/>
  </g>
  <!-- Title centered below icon -->
  <text x="392" y="216" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Stablecoin</text>
  <text x="392" y="232" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Payments</text>
  <!-- Features -->
  <text x="392" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Cross-Border Rails</text>
  <text x="392" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">GENIUS Act Ready</text>
  <text x="392" y="296" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Fiat On/Off Ramp</text>

  <!-- Solution 4: Bitcoin Exchange -->
  <rect x="468" y="148" width="120" height="206" rx="10" fill="rgba(54,84,255,0.08)" stroke="rgba(54,84,255,0.25)" stroke-width="1"/>
  <!-- Icon centered -->
  <rect x="512" y="164" width="32" height="32" rx="7" fill="rgba(54,84,255,0.2)"/>
  <g transform="translate(519, 170)" fill="none" stroke="#6b82ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="1,6 5,2 9,6"/>
    <line x1="5" y1="2" x2="5" y2="16"/>
    <polyline points="17,12 13,16 9,12"/>
    <line x1="13" y1="16" x2="13" y2="2"/>
  </g>
  <!-- Title centered below icon -->
  <text x="528" y="216" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Bitcoin</text>
  <text x="528" y="232" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="white">Exchange</text>
  <!-- Features -->
  <text x="528" y="260" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Buy &amp; Sell</text>
  <text x="528" y="278" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">Fee Revenue</text>
  <text x="528" y="296" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#9ca3af">OCC Compliant</text>

  <!-- Integration Layer -->
  <rect x="40" y="400" width="520" height="42" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="300" y="416" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">INTEGRATION LAYER</text>
  <text x="300" y="432" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#475569">REST &amp; GraphQL APIs  ·  Webhooks  ·  Core Banking Connectors</text>

  <!-- Connection line from grouped container to integration layer -->
  <line x1="300" y1="366" x2="300" y2="400" stroke="rgba(255,255,255,0.15)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Bottom: Bank + Custodian + Compliance -->
  <rect x="60" y="468" width="150" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="135" y="488" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Your Bank Core</text>

  <rect x="230" y="468" width="140" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="300" y="488" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Your Custodian</text>

  <rect x="390" y="468" width="150" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="465" y="488" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">Your Compliance</text>

  <!-- Connection arrows to bottom -->
  <line x1="135" y1="442" x2="135" y2="468" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="300" y1="442" x2="300" y2="468" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="465" y1="442" x2="465" y2="468" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>
