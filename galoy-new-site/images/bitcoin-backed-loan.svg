<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="480" height="400" rx="16" fill="url(#bgG)"/>

  <!-- Title -->
  <text x="240" y="36" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">LENDING MODEL COMPARISON</text>

  <!-- Left column: Traditional Lending -->
  <rect x="24" y="54" width="208" height="320" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="24" y="54" width="208" height="38" rx="12" fill="#f3f4f6"/>
  <rect x="24" y="78" width="208" height="14" fill="#f3f4f6"/>
  <text x="128" y="79" text-anchor="middle" fill="#6b7280" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">Unsecured Lending</text>

  <!-- Traditional: Collateral -->
  <rect x="40" y="104" width="176" height="48" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="124" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Collateral</text>
  <text x="52" y="142" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">None or illiquid</text>

  <!-- Traditional: Default Risk -->
  <rect x="40" y="162" width="176" height="48" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="182" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Default Risk</text>
  <text x="52" y="200" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">High exposure</text>

  <!-- Traditional: Monitoring -->
  <rect x="40" y="220" width="176" height="48" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="240" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Monitoring</text>
  <text x="52" y="258" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Manual reviews</text>

  <!-- Traditional: Liquidation -->
  <rect x="40" y="278" width="176" height="48" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="52" y="298" fill="#991b1b" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Liquidation</text>
  <text x="52" y="316" fill="#b91c1c" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Slow, uncertain</text>

  <!-- Divider arrow -->
  <text x="240" y="208" text-anchor="middle" fill="#3654FF" font-family="Inter, system-ui, sans-serif" font-size="20">→</text>

  <!-- Right column: Bitcoin-Backed -->
  <rect x="248" y="54" width="208" height="320" rx="12" fill="white" stroke="#3654FF" stroke-width="2"/>
  <rect x="248" y="54" width="208" height="38" rx="12" fill="#3654FF"/>
  <rect x="248" y="78" width="208" height="14" fill="#3654FF"/>
  <text x="352" y="79" text-anchor="middle" fill="white" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700">BTC-Backed + Lana</text>

  <!-- BTC: Collateral -->
  <rect x="264" y="104" width="176" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="276" y="124" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Collateral</text>
  <text x="276" y="142" fill="#1d4ed8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">BTC, 50–70% LTV</text>

  <!-- BTC: Default Risk -->
  <rect x="264" y="162" width="176" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="276" y="182" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Default Risk</text>
  <text x="276" y="200" fill="#1d4ed8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Over-collateralized</text>

  <!-- BTC: Monitoring -->
  <rect x="264" y="220" width="176" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="276" y="240" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Monitoring</text>
  <text x="276" y="258" fill="#1d4ed8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Real-time, automated</text>

  <!-- BTC: Liquidation -->
  <rect x="264" y="278" width="176" height="48" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="276" y="298" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600">Liquidation</text>
  <text x="276" y="316" fill="#1d4ed8" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Automated triggers</text>

  <!-- Bottom tagline -->
  <text x="240" y="392" text-anchor="middle" fill="#1e3a8a" font-family="Inter, system-ui, sans-serif" font-size="10">Custody-independent · Powered by Lana</text>
</svg>